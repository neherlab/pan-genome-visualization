name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euxo pipefail {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    concurrency:
      group: check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mise installs the tools of .config/mise.toml at the URLs and checksums of .config/mise.lock.
      - name: Install tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.17

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: just check
